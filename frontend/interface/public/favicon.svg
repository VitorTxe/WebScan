<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <defs>
    <!-- Gradiente do contorno do escudo -->
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#863BFF" />
      <stop offset="100%" stop-color="#47BFFF" />
    </linearGradient>
    
    <!-- Gradiente do feixe de scanner horizontal -->
    <linearGradient id="scannerGrad" x1="6" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#47BFFF" stop-opacity="0" />
      <stop offset="15%" stop-color="#47BFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#47BFFF" stop-opacity="1" />
      <stop offset="85%" stop-color="#47BFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#47BFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow/Brilho do feixe -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Escudo Técnico Principal -->
  <path d="M24 4L6 10v12c0 11.02 7.68 21.38 18 24 10.32-2.62 18-12.98 18-24V10L24 4z" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round" 
        fill="#120E2E" 
        fill-opacity="0.85" />

  <!-- Detalhe interno do Escudo (Grid de Rede / Linhas de Varredura) -->
  <path d="M24 8v34M12 17h24M9 25h30M12 33h24" 
        stroke="#863BFF" 
        stroke-width="1.5" 
        stroke-opacity="0.2" 
        stroke-linecap="round" />

  <!-- Feixe de Scanner ativo (Laser de Varredura) -->
  <g filter="url(#glow)">
    <!-- Linha principal do laser -->
    <line x1="8" y1="23" x2="40" y2="23" stroke="url(#scannerGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Brilho secundário da varredura -->
    <line x1="12" y1="21" x2="36" y2="21" stroke="#47BFFF" stroke-width="0.75" stroke-opacity="0.7" stroke-linecap="round" />
    <line x1="12" y1="25" x2="36" y2="25" stroke="#47BFFF" stroke-width="0.75" stroke-opacity="0.7" stroke-linecap="round" />
  </g>

  <!-- Ponto Central de Varredura (Alvo) -->
  <circle cx="24" cy="23" r="3" fill="#47BFFF" filter="url(#glow)" />
</svg>